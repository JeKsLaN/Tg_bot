#!/usr/bin/env python3
"""Ежедневный пост в Telegram-канал.

Формат поста:
  1. Погода в Купино.
  2. ОДНА главная новость дня.
  3. Происшествия по Новосибирску и Купино (только если они были).

Только стандартная библиотека Python, ставить ничего не нужно.
"""
import json
import os
import re
import sys
import urllib.parse
import urllib.request
import xml.etree.ElementTree as ET
from datetime import datetime, timedelta, timezone
from email.utils import parsedate_to_datetime

# ---------- настройки (всё можно переопределить через переменные окружения) ----------

TG_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "@blogg_zheki")
ANTHROPIC_KEY = os.environ.get("ANTHROPIC_API_KEY", "")
MODEL = os.environ.get("CLAUDE_MODEL", "claude-sonnet-5-5")
DRY_RUN = os.environ.get("DRY_RUN") == "1"  # 1 = только напечатать пост, не отправлять

# Купино, Новосибирская область
LAT, LON = 54.386, 77.31

# Ленты для ГЛАВНОЙ новости (через пробел или с новой строки)
MAIN_FEEDS = os.environ.get(
    "MAIN_FEEDS",
    "https://lenta.ru/rss/news https://ria.ru/export/rss2/archive/index.xml",
).split()

# Ленты для происшествий. Подставь сюда рабочие RSS новостных сайтов Новосибирска.
INCIDENT_FEEDS = os.environ.get("INCIDENT_FEEDS", "https://ngs.ru/rss/").split()

PLACE_RE = re.compile(r"новосибирск|купино|купинск|\bНСО\b", re.IGNORECASE)
INCIDENT_RE = re.compile(
    r"дтп|авари|пожар|погиб|погибл|разбил|задержан|задержал|пострадал|"
    r"взрыв|горит|горел|упал|утонул|пропал|ограбл|нападени|происшестви|чп\b",
    re.IGNORECASE,
)

WEATHER_CODES = {
    0: "ясно", 1: "в основном ясно", 2: "переменная облачность", 3: "пасмурно",
    45: "туман", 48: "туман", 51: "лёгкая морось", 53: "морось", 55: "сильная морось",
    61: "небольшой дождь", 63: "дождь", 65: "сильный дождь",
    71: "небольшой снег", 73: "снег", 75: "сильный снег", 77: "снежная крупа",
    80: "ливень", 81: "ливень", 82: "сильный ливень",
    85: "снегопад", 86: "сильный снегопад", 95: "гроза", 96: "гроза с градом", 99: "гроза с градом",
}


# ---------- вспомогательное ----------

def http(url, data=None, headers=None, timeout=30):
    req = urllib.request.Request(
        url, data=data, headers={"User-Agent": "Mozilla/5.0 (kupino-bot)", **(headers or {})}
    )
    with urllib.request.urlopen(req, timeout=timeout) as resp:
        return resp.read()


def get_weather():
    query = urllib.parse.urlencode({
        "latitude": LAT,
        "longitude": LON,
        "daily": "temperature_2m_max,temperature_2m_min,wind_speed_10m_max,weather_code",
        "wind_speed_unit": "ms",
        "timezone": "Asia/Novosibirsk",
        "forecast_days": 1,
    })
    daily = json.loads(http(f"https://api.open-meteo.com/v1/forecast?{query}"))["daily"]
    return {
        "днём": round(daily["temperature_2m_max"][0]),
        "ночью": round(daily["temperature_2m_min"][0]),
        "ветер_макс_м_с": round(daily["wind_speed_10m_max"][0]),
        "погода": WEATHER_CODES.get(daily["weather_code"][0], ""),
    }


def read_feed(url):
    items = []
    try:
        root = ET.fromstring(http(url))
    except Exception as exc:  # лента недоступна, пропускаем
        print(f"[warn] не удалось прочитать {url}: {exc}", file=sys.stderr)
        return items
    for node in root.iter("item"):
        title = (node.findtext("title") or "").strip()
        desc = re.sub(r"<[^>]+>", "", node.findtext("description") or "").strip()
        published = None
        raw_date = node.findtext("pubDate")
        if raw_date:
            try:
                published = parsedate_to_datetime(raw_date)
                if published.tzinfo is None:
                    published = published.replace(tzinfo=timezone.utc)
            except Exception:
                published = None
        if title:
            items.append({"title": title, "text": desc[:300], "published": published})
    return items


def get_main_news(limit=15):
    seen, result = set(), []
    for url in MAIN_FEEDS:
        for item in read_feed(url)[:10]:
            if item["title"] not in seen:
                seen.add(item["title"])
                result.append({"title": item["title"], "text": item["text"]})
    return result[:limit]


def get_incidents(limit=5):
    since = datetime.now(timezone.utc) - timedelta(hours=24)
    seen, result = set(), []
    for url in INCIDENT_FEEDS:
        for item in read_feed(url):
            if item["published"] and item["published"] < since:
                continue
            blob = f"{item['title']} {item['text']}"
            if PLACE_RE.search(blob) and INCIDENT_RE.search(blob) and item["title"] not in seen:
                seen.add(item["title"])
                result.append({"title": item["title"], "text": item["text"]})
    return result[:limit]


# ---------- текст поста ----------

SYSTEM_PROMPT = """Ты ведёшь развлекательный Telegram-канал «Блог|Жеки» от лица автора.
Пиши по-русски, неформально и коротко, как живой человек, без пафоса и канцелярита.
Пример стиля: «Всем привет. В Купино сегодня +4 градуса. Из новостей я тут узнал, что вот собачка тут такая смешная».

Правила:
1. Начни с «Всем привет.» и сразу напиши погоду в Купино (температуру днём и ночью, коротко про ветер/осадки).
2. Выбери из списка ОДНУ самую главную и популярную новость дня и перескажи её в 1-3 предложениях своими словами, нейтрально, без оценок и без выдумок.
3. Если список происшествий НЕ пустой, добавь одной-двумя короткими фразами самое заметное происшествие в Новосибирске или Купино. Если список пустой, происшествия вообще не упоминай и не пиши, что их нет.
4. Используй ТОЛЬКО факты из переданных данных. Ничего не придумывай.
5. Без markdown, без хэштегов, не больше 700 символов. Верни только текст поста."""


def build_post(weather, news, incidents):
    facts = json.dumps(
        {"погода_в_Купино": weather, "новости_дня": news, "происшествия_Новосибирск_Купино": incidents},
        ensure_ascii=False,
    )
    if ANTHROPIC_KEY:
        try:
            body = json.dumps({
                "model": MODEL,
                "max_tokens": 600,
                "system": SYSTEM_PROMPT,
                "messages": [{"role": "user", "content": facts}],
            }).encode()
            reply = json.loads(http(
                "https://api.anthropic.com/v1/messages",
                data=body,
                headers={
                    "content-type": "application/json",
                    "x-api-key": ANTHROPIC_KEY,
                    "anthropic-version": "2023-06-01",
                },
                timeout=90,
            ))
            text = "".join(b.get("text", "") for b in reply["content"] if b.get("type") == "text").strip()
            if text:
                return text
        except Exception as exc:
            print(f"[warn] Claude API не сработал, беру шаблон: {exc}", file=sys.stderr)
    return fallback_post(weather, news, incidents)


def fallback_post(weather, news, incidents):
    lines = [
        f"Всем привет. В Купино сегодня {weather['днём']:+d} днём, {weather['ночью']:+d} ночью, "
        f"{weather['погода']}, ветер до {weather['ветер_макс_м_с']} м/с."
    ]
    if news:
        lines.append(f"Главная новость дня: {news[0]['title']}.")
    if incidents:
        lines.append(f"Из происшествий: {incidents[0]['title']}.")
    return "\n\n".join(lines)


# ---------- отправка ----------

def send_to_telegram(text):
    payload = json.dumps({"chat_id": CHAT_ID, "text": text}).encode()
    resp = http(
        f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
        data=payload,
        headers={"content-type": "application/json"},
    )
    data = json.loads(resp)
    if not data.get("ok"):
        raise RuntimeError(f"Telegram вернул ошибку: {data}")


def main():
    weather = get_weather()
    news = get_main_news()
    incidents = get_incidents()
    post = build_post(weather, news, incidents)
    print("----- ПОСТ -----")
    print(post)
    print("----------------")
    if DRY_RUN:
        print("DRY_RUN=1, в канал не отправляю")
        return
    send_to_telegram(post)
    print("Отправлено")


if __name__ == "__main__":
    main()
